# https://golangci-lint.run/usage/configuration/
version: "2"                # config-format v2 (golangci-lint >= 1.62)

run:
  timeout: 5m
  tests: true
  build-tags:
    - integration

linters:
  enable:
    - govet
    - ineffassign
    - staticcheck
    - unused
    - errcheck
    - revive
    - gocritic
    - bodyclose
    - gosec
    - misspell
    - errorlint
    - cyclop
    - gocyclo
    - godot
    - prealloc
    - nakedret
    - nilerr
    - whitespace
    - wsl_v5
    - mnd
  disable:
    - funlen
    - lll
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    gocritic:
      enabled-tags:
        - diagnostic
        - style
    revive:
      rules:
        - name: exported
          severity: warning
    gosec:
      excludes:
        - G115
    cyclop:
      max-complexity: 15
    gocyclo:
      min-complexity: 15
    misspell:
      locale: US
    mnd:
      ignored-numbers:
        - "0"
        - "1"
        - "2"
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gocyclo
          - gocritic
          - wsl_v5
          - errcheck
      - path: internal/naming
        text: "godot|misspell"

formatters:
  enable:
    - gofmt
    - goimports
